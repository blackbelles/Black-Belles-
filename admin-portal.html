<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBE Admin Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #111;
      border: 1px solid #4F1D8B;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      font-size: 58px;
      letter-spacing: 8px;
      color: #489FB1;
    }

    .brand p {
      margin: 4px 0 0;
      color: #aaa;
      letter-spacing: 2px;
    }

    h2 {
      margin-top: 0;
    }

    .small {
      color: #aaa;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #181818;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #4F1D8B;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #222;
      border: 1px solid #489FB1;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #1b1b1b;
      color: #ddd;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .dashboard-header button {
      width: auto;
      margin: 0;
      padding: 10px 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat {
      background: #181818;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: #489FB1;
      margin-top: 5px;
    }

    .user-list {
      display: grid;
      gap: 14px;
    }

    .user-card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
    }

    .user-card h3 {
      margin: 0 0 8px;
    }

    .user-card p {
      margin: 5px 0;
      color: #bbb;
    }

    .user-card select {
      margin-top: 12px;
    }

    .remove-account {
      background: #7a1f2b;
      margin-top: 10px;
    }

    .approve {
      background: #489FB1;
      color: #000;
    }

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: stretch;
      }

      .dashboard-header button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <div class="brand">
    <h1>BBE</h1>
    <p>ADMIN PORTAL</p>
  </div>

  <!-- LOGIN -->
  <section id="loginView">

    <h2>Administrator Sign In</h2>

    <p class="small">
      Sign in with an approved BBE administrator account.
    </p>

    <form id="loginForm" onsubmit="adminLogin(event)">

      <label>Email</label>
      <input id="loginEmail" type="email" required>

      <label>Password</label>
      <input id="loginPassword" type="password" required>

      <button type="submit">Sign In</button>

    </form>

    <div id="loginMessage" class="message hidden"></div>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboardView" class="hidden">

    <div class="dashboard-header">

      <div>
        <h2>Admin Dashboard</h2>
        <p class="small" id="welcomeMessage"></p>
      </div>

      <button class="secondary" id="logoutButton">
        Log Out
      </button>

    </div>


    <div class="stats">

      <div class="stat">
        Total Accounts
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        Pending
        <strong id="pendingCount">0</strong>
      </div>

      <div class="stat">
        Approved
        <strong id="approvedCount">0</strong>
      </div>

    </div>


    <h2>Parent Accounts</h2>

    <h2 style="margin-top:32px;">2026 Registrations</h2><div id="registrationList" class="user-list"><p class="small">Loading registrations...</p></div><div id="userList" class="user-list">
      <p class="small">Loading accounts...</p>
    </div>

  </section>


  <div class="links">
    <a href="index.html" style="color:#489FB1;">
      ← Back to BBE Website
    </a>
  </div>

</div>


<script>
const SUPABASE_URL="https://xpwvjynoaoqriygbijlb.supabase.co";
const SUPABASE_KEY="sb_publishable_5sYm56f6kqiOGl_mM_Vulw_FXnifWTo";
const loginView=document.getElementById("loginView"),dashboardView=document.getElementById("dashboardView"),loginMessage=document.getElementById("loginMessage");
async function supabaseRequest(path,options={}){const response=await fetch(SUPABASE_URL+path,{...options,headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.msg||data.message||data.error_description||"Something went wrong.");return data}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function adminLogin(event){event.preventDefault();loginMessage.textContent="Signing in...";loginMessage.classList.remove("hidden");try{const result=await supabaseRequest("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:document.getElementById("loginEmail").value.trim(),password:document.getElementById("loginPassword").value})});localStorage.setItem("bbe_admin_access_token",result.access_token);if(result.refresh_token)localStorage.setItem("bbe_admin_refresh_token",result.refresh_token);const rows=await supabaseRequest("/rest/v1/profiles?select=id,parent_name,approved,role&id=eq."+encodeURIComponent(result.user.id),{headers:{"Authorization":"Bearer "+result.access_token}});const profile=rows[0];if(!profile)throw new Error("Your BBE profile could not be found.");if(!profile.approved)throw new Error("Your account has not been approved.");if(profile.role!=="admin")throw new Error("This account does not have administrator access.");loginView.classList.add("hidden");dashboardView.classList.remove("hidden");document.getElementById("welcomeMessage").textContent="Welcome, "+profile.parent_name+".";await loadAccounts();await loadRegistrations()}catch(error){loginMessage.textContent=error.message||"Unable to sign in."}}
async function loadAccounts(){const token=localStorage.getItem("bbe_admin_access_token");if(!token)return;try{const profiles=await supabaseRequest("/rest/v1/profiles?select=id,parent_name,child_name,location,approved,role,created_at&order=created_at.desc",{headers:{"Authorization":"Bearer "+token}});document.getElementById("totalCount").textContent=profiles.length;document.getElementById("pendingCount").textContent=profiles.filter(p=>!p.approved).length;document.getElementById("approvedCount").textContent=profiles.filter(p=>p.approved).length;const list=document.getElementById("userList");list.innerHTML="";profiles.forEach(p=>{const card=document.createElement("div");card.className="user-card";card.innerHTML="<h3>"+escapeHtml(p.parent_name)+"</h3><p><strong>Child:</strong> "+escapeHtml(p.child_name)+"</p><p><strong>Location:</strong> "+escapeHtml(p.location)+"</p><p><strong>Status:</strong> "+(p.approved?"Approved":"Pending")+"</p><p><strong>Role:</strong> "+escapeHtml(p.role)+"</p><select class='roleSelect' data-id='"+p.id+"' data-role='"+escapeHtml(p.role)+"'><option value='parent'>Parent</option><option value='coach'>Coach</option><option value='admin'>Admin</option></select>"+(!p.approved?"<button class='approve' data-id='"+p.id+"'>Approve Account</button>":"")+"<button class='remove-account' data-id='"+p.id+"' data-name='"+escapeHtml(p.parent_name)+"'>Remove Account</button>;list.appendChild(card)});document.querySelectorAll(".approve").forEach(b=>b.onclick=async()=>{await updateProfile(b.dataset.id,{approved:true})});document.querySelectorAll(".roleSelect").forEach(s=>{s.value=s.dataset.role||"parent"; s.onchange=async()=>await updateProfile(s.dataset.id,{role:s.value})});document.querySelectorAll(".remove-account").forEach(b=>b.onclick=async()=>{const name=b.dataset.name||"this account";if(!confirm("Remove "+name+" permanently? This will delete the account and its associated registration data. This cannot be undone."))return;b.disabled=true;b.textContent="Removing...";try{await deleteAccount(b.dataset.id)}catch(e){alert(e.message||"Unable to remove account.");b.disabled=false;b.textContent="Remove Account"}})}catch(e){document.getElementById("userList").textContent=e.message}}
async function deleteAccount(id){const token=localStorage.getItem("bbe_admin_access_token");if(!token)throw new Error("Administrator session expired. Please sign in again.");if(!confirm("Final confirmation: permanently delete this account?"))return;await supabaseRequest("/rest/v1/rpc/delete_parent_account",{method:"POST",headers:{"Authorization":"Bearer "+token,"Prefer":"return=minimal"},body:JSON.stringify({target_user_id:id})});await loadAccounts();await loadRegistrations()}
async function updateProfile(id,changes){const token=localStorage.getItem("bbe_admin_access_token");await supabaseRequest("/rest/v1/profiles?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Authorization":"Bearer "+token,"Prefer":"return=minimal"},body:JSON.stringify(changes)});await loadAccounts()}
async function loadRegistrations(){const token=localStorage.getItem("bbe_admin_access_token");if(!token)return;try{const rows=await supabaseRequest("/rest/v1/registrations?select=*&order=created_at.desc",{headers:{"Authorization":"Bearer "+token}});const list=document.getElementById("registrationList");list.innerHTML="";if(!rows.length){list.textContent="No registrations submitted yet.";return}rows.forEach(r=>{const card=document.createElement("div");card.className="user-card";const h=document.createElement("h3");h.textContent=r.child_name||"Registration";card.appendChild(h);Object.keys(r).forEach(k=>{if(["id","parent_id","created_at","child_name"].includes(k))return;const p=document.createElement("p");p.textContent=k.replaceAll("_"," ")+": "+(r[k]??"—");card.appendChild(p)});list.appendChild(card)})}catch(e){document.getElementById("registrationList").textContent=e.message}}
document.getElementById("loginForm").addEventListener("submit",adminLogin);
document.getElementById("logoutButton").addEventListener("click",()=>{localStorage.removeItem("bbe_admin_access_token");localStorage.removeItem("bbe_admin_refresh_token");dashboardView.classList.add("hidden");loginView.classList.remove("hidden");document.getElementById("loginForm").reset();loginMessage.classList.add("hidden")});
</script>
</body>
</html>
